<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpriteBot 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 32px; text-align: center; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .subtitle { text-align: center; font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 30px; }
        .table-wrapper { background: rgba(0,0,0,0.1); border-radius: 15px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.05); }
        thead { background: rgba(0,0,0,0.2); }
        th { padding: 15px; text-align: left; font-weight: 700; border-bottom: 2px solid rgba(255,255,255,0.1); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover { background: rgba(255,255,255,0.08); }
        .spiritello-name { font-weight: 600; min-width: 120px; }
        .sprite-cell { text-align: center; }
        .sprite-box { width: 80px; height: 80px; margin: 0 auto; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .sprite-box:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); transform: scale(1.05); }
        .sprite-box img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
        .sprite-box.active { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); border-color: #00f2fe; box-shadow: 0 0 20px rgba(0,242,254,0.5); }
        .sprite-box.active::after { content: "✓"; position: absolute; top: -5px; right: -5px; background: #00ff00; color: #000; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .loading { text-align: center; padding: 40px; font-size: 18px; }
        .error { background: rgba(255,100,100,0.3); padding: 15px; border-radius: 10px; margin: 20px 0; border-left: 4px solid #ff6464; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SpriteBot 2.0</h1>
        <div class="subtitle">Gestisci la tua collezione di Spiritelli</div>
        <div class="table-wrapper">
            <div id="loading" class="loading">Caricamento...</div>
            <table id="spiritelli-table" style="display: none;">
                <thead>
                    <tr>
                        <th>SPIRITELLO</th>
                        <th>BASE</th>
                        <th>ORO</th>
                        <th>MAESTRO</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let initData = tg.initData || "";
        let spiritelli = [];
        let varianti = [];
        let collezione = [];

        async function carica() {
            try {
                const configRes = await fetch('/api/spiritelli');
                const config = await configRes.json();
                spiritelli = config.spiritelli;
                varianti = config.varianti;

                const collezioneRes = await fetch('/api/collezione', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData })
                });

                if (!collezioneRes.ok) throw new Error('Errore caricamento');
                const data = await collezioneRes.json();
                collezione = data.collezione;

                renderTabella();
            } catch (e) {
                mostraErrore('Errore: ' + e.message);
            }
        }

        function getNomeImmagine(spiritello, variante) {
            const spiritelloLower = spiritello.toLowerCase().replace(/\s+/g, '-');
            const varianteLower = variante.toLowerCase().replace(/\s+/g, '-');
            return '/static/spiritelli/' + spiritelloLower + '-' + varianteLower + '.png';
        }

        function renderTabella() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            spiritelli.forEach(function(spiritello) {
                const row = document.createElement('tr');
                row.innerHTML = '<td class="spiritello-name">' + spiritello + '</td>';

                varianti.forEach(function(variante) {
                    const possiede = collezione.some(function(s) {
                        return s.spiritello === spiritello && s.variante === variante;
                    });

                    const cell = document.createElement('td');
                    cell.className = 'sprite-cell';
                    
                    const box = document.createElement('div');
                    box.className = 'sprite-box' + (possiede ? ' active' : '');
                    box.onclick = function() { toggle(spiritello, variante, box); };

                    const img = document.createElement('img');
                    img.src = getNomeImmagine(spiritello, variante);
                    img.onerror = function() { img.style.display = 'none'; };

                    box.appendChild(img);
                    cell.appendChild(box);
                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('spiritelli-table').style.display = 'table';
        }

        async function toggle(spiritello, variante, boxElement) {
            try {
                const res = await fetch('/api/toggle', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ spiritello: spiritello, variante: variante, initData: initData })
                });

                if (!res.ok) throw new Error('Errore');
                const data = await res.json();

                if (data.azione === 'aggiunto') {
                    collezione.push({ spiritello: spiritello, variante: variante });
                    boxElement.classList.add('active');
                } else {
                    collezione = collezione.filter(function(s) {
                        return !(s.spiritello === spiritello && s.variante === variante);
                    });
                    boxElement.classList.remove('active');
                }

                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            } catch (e) {
                mostraErrore('Errore: ' + e.message);
            }
        }

        function mostraErrore(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        carica();
    </script>
</body>
</html>
