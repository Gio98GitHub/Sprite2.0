<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpriteBot 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Bangers', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 15px;
        }
        
        .container { max-width: 100%; margin: 0 auto; }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-family: 'Bangers', cursive;
            font-size: 48px;
            font-weight: 700;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 5px;
            font-weight: 600;
            font-family: 'Bangers', cursive;
        }
        
        .table-wrapper {
            background: rgba(0,0,0,0.1);
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.05);
            min-width: 600px;
        }
        
        thead {
            background: rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
        }
        
        th {
            padding: 12px 8px;
            text-align: center;
            font-weight: 700;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            font-size: 11px;
            font-family: 'Bangers', cursive;
        }
        
        th:first-child {
            text-align: left;
        }
        
        td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        td:first-child {
            text-align: left;
            font-weight: 600;
            min-width: 100px;
            font-family: 'Bangers', cursive;
        }
        
        tr:hover {
            background: rgba(255,255,255,0.08);
        }
        
        .sprite-box {
            width: 70px;
            height: 70px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .sprite-box:hover {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }
        
        .sprite-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 3px;
        }
        
        .sprite-box.active {
            background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.8);
        }
        
        .sprite-box.active::after {
            content: "✓";
            position: absolute;
            top: -8px;
            right: -8px;
            background: #00ff00;
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #fff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            font-family: 'Bangers', cursive;
        }
        
        .error {
            background: rgba(255,100,100,0.3);
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #ff6464;
            font-size: 14px;
            font-family: 'Bangers', cursive;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SpriteBot 2.0</h1>
            <div class="subtitle">Collezione di <span id="username">...</span></div>
        </div>
        
        <div class="table-wrapper">
            <div id="loading" class="loading">Caricamento...</div>
            <table id="spiritelli-table" style="display: none;">
                <thead>
                    <tr>
                        <th>SPIRITELLO</th>
                        <th>BASE</th>
                        <th>ORO</th>
                        <th>MAESTRO</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let initData = tg.initData || "";
        let spiritelli = [];
        let varianti = [];
        let collezione = [];
        let currentUser = null;

        async function carica() {
            try {
                const configRes = await fetch('/api/spiritelli');
                const config = await configRes.json();
                spiritelli = config.spiritelli;
                varianti = config.varianti;

                const collezioneRes = await fetch('/api/collezione', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData || initData })
                });

                if (!collezioneRes.ok) throw new Error('Errore caricamento');
                const data = await collezioneRes.json();
                collezione = data.collezione || [];
                currentUser = data.user;

                if (currentUser && currentUser.first_name) {
                    document.getElementById('username').textContent = currentUser.first_name;
                } else {
                    document.getElementById('username').textContent = 'Giocatore';
                }

                renderTabella();
            } catch (e) {
                mostraErrore('Errore: ' + e.message);
            }
        }

        function getNomeImmagine(spiritello, variante) {
            const spiritelloLower = spiritello.toLowerCase().replace(/\s+/g, '-');
            const varianteLower = variante.toLowerCase().replace(/\s+/g, '-');
            return '/static/spiritelli/' + spiritelloLower + '-' + varianteLower + '.png';
        }

        function renderTabella() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            spiritelli.forEach(function(spiritello) {
                const row = document.createElement('tr');
                row.innerHTML = '<td>' + spiritello + '</td>';

                varianti.forEach(function(variante) {
                    const possiede = collezione.some(function(s) {
                        return s.spiritello === spiritello && s.variante === variante;
                    });

                    const cell = document.createElement('td');
                    const box = document.createElement('div');
                    box.className = 'sprite-box' + (possiede ? ' active' : '');
                    box.onclick = function() { toggle(spiritello, variante, box); };

                    const img = document.createElement('img');
                    img.src = getNomeImmagine(spiritello, variante);
                    img.onerror = function() { img.style.display = 'none'; };

                    box.appendChild(img);
                    cell.appendChild(box);
                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('spiritelli-table').style.display = 'table';
        }

        async function toggle(spiritello, variante, boxElement) {
            try {
                const res = await fetch('/api/toggle', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ spiritello: spiritello, variante: variante, initData: tg.initData || initData })
                });

                if (!res.ok) throw new Error('Errore');
                const data = await res.json();

                if (data.azione === 'aggiunto') {
                    collezione.push({ spiritello: spiritello, variante: variante });
                    boxElement.classList.add('active');
                } else {
                    collezione = collezione.filter(function(s) {
                        return !(s.spiritello === spiritello && s.variante === variante);
                    });
                    boxElement.classList.remove('active');
                }

                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            } catch (e) {
                mostraErrore('Errore: ' + e.message);
            }
        }

        function mostraErrore(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        carica();
    </script>
</body>
</html>
