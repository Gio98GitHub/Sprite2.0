<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpriteBot 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Fredoka', sans-serif;
            background: url('/static/background.png') center/cover no-repeat fixed;
            min-height: 100vh;
            padding: 15px;
            color: #fff;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 20, 0.3);
            pointer-events: none;
            z-index: 1;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            padding-bottom: 80px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-family: 'Bangers', cursive;
            font-size: 48px;
            font-weight: 700;
            text-shadow: 3px 3px 0px rgba(255, 0, 255, 0.8), 6px 6px 0px rgba(0, 255, 255, 0.6);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 5px;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }
        
        .table-wrapper {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5), 0 0 60px rgba(0, 255, 255, 0.3);
            padding: 10px;
            border: 2px solid rgba(255, 0, 255, 0.3);
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(10, 10, 40, 0.8);
            min-width: 600px;
        }
        
        thead {
            background: rgba(255, 0, 255, 0.2);
            position: static;
            top: 0;
            border-bottom: 2px solid rgba(0, 255, 255, 0.5);
        }
        
        th {
            padding: 20px 8px;
            text-align: center;
            font-weight: 700;
            font-size: 11px;
            font-family: 'Fredoka', sans-serif;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            height: 60px;
            white-space: normal;
            word-break: break-word;
            vertical-align: middle;
        }
        
        th:first-child {
            text-align: left;
        }
        
        td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 0, 255, 0.1);
        }
        
        td:first-child {
            text-align: left;
            font-weight: 600;
            min-width: 100px;
            font-family: 'Fredoka', sans-serif;
            color: #ff00ff;
        }
        
        tr:hover {
            background: rgba(255, 0, 255, 0.1);
        }
        
        .sprite-box {
            width: 70px;
            height: 70px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .sprite-box:hover {
            border-color: rgba(255, 0, 255, 0.8);
            background: rgba(255, 0, 255, 0.1);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
        }
        
        .sprite-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 3px;
        }
        
        .sprite-box.active {
            background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
            border-color: #00ff00;
            box-shadow: 0 0 25px rgba(0, 255, 0, 1);
        }
        
        .sprite-box.mastered {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-color: #FFD700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 1);
        }
        
        .sprite-box.pending {
            opacity: 0.5;
            cursor: wait;
            border-color: rgba(255, 255, 0, 0.6);
        }
        
        .button-container {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
        }
        
        .crea-immagine-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
            border: 2px solid #00ff00;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .crea-immagine-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 0, 1);
        }
        
        .crea-immagine-btn:active {
            transform: scale(0.98);
        }
        
        .crea-immagine-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(1);
        }
        
        .watermark {
            position: fixed;
            bottom: 80px;
            right: 10px;
            font-size: 8px;
            color: rgba(0, 255, 255, 0.4);
            font-family: 'Fredoka', sans-serif;
            text-align: right;
            text-shadow: 0 0 3px rgba(0, 255, 255, 0.3);
            z-index: 5;
            max-width: 80px;
            line-height: 1.2;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            font-family: 'Fredoka', sans-serif;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .error {
            background: rgba(255, 0, 0, 0.3);
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid rgba(255, 0, 0, 0.6);
            font-size: 14px;
            font-family: 'Fredoka', sans-serif;
            color: #ff6666;
        }

        .success {
            background: rgba(0, 255, 0, 0.2);
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid rgba(0, 255, 0, 0.6);
            font-size: 14px;
            font-family: 'Fredoka', sans-serif;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container" id="screenshot-container">
        <div class="header">
            <h1>SpriteBot 2.0</h1>
            <div class="subtitle">Collezione di <span id="username">...</span></div>
        </div>
        
        <div class="table-wrapper">
            <div id="loading" class="loading">Caricamento...</div>
            <table id="spiritelli-table" style="display: none;">
                <thead>
                    <tr>
                        <th>SPIRITELLO</th>
                        <th>BASE</th>
                        <th>ORO</th>
                        <th>MAESTRO<br>DEI TRUCCHI</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <div class="button-container">
        <button class="crea-immagine-btn" id="creaImmagineBtn">Crea Immagine</button>
    </div>

    <div class="watermark">By Fortnite_Italia_Leaks<br>on Telegram</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let initData = tg.initData || "";
        let spiritelli = [];
        let varianti = [];
        let collezione = [];
        let currentUser = null;

        async function carica() {
            try {
                const configRes = await fetch('/api/spiritelli');
                const config = await configRes.json();
                spiritelli = config.spiritelli;
                varianti = config.varianti;

                const collezioneRes = await fetch('/api/collezione', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: tg.initData || initData })
                });

                if (!collezioneRes.ok) throw new Error('Errore caricamento');
                const data = await collezioneRes.json();
                collezione = data.collezione || [];
                currentUser = data.user;

                if (currentUser && currentUser.first_name) {
                    document.getElementById('username').textContent = currentUser.first_name;
                } else {
                    document.getElementById('username').textContent = 'Giocatore';
                }

                renderTabella();
            } catch (e) {
                mostraErrore('Errore: ' + e.message);
            }
        }

        function getNomeImmagine(spiritello, variante) {
            const spiritelloLower = spiritello.toLowerCase().replace(/\s+/g, '-');
            const varianteLower = variante.toLowerCase().replace(/\s+/g, '-');
            return '/static/spiritelli/' + spiritelloLower + '-' + varianteLower + '.png';
        }

        function renderTabella() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            spiritelli.forEach(function(spiritello) {
                const row = document.createElement('tr');
                row.innerHTML = '<td>' + spiritello + '</td>';

                varianti.forEach(function(variante) {
                    const item = collezione.find(function(s) {
                        return s.spiritello === spiritello && s.variante === variante;
                    });
                    const possiede = item !== undefined;
                    const mastered = possiede && item.mastered;  // ✅ NUOVO

                    const cell = document.createElement('td');
                    const box = document.createElement('div');
                    box.className = 'sprite-box' + (mastered ? ' mastered' : (possiede ? ' active' : ''));
                    box.onclick = function() { toggle(spiritello, variante, box); };

                    const img = document.createElement('img');
                    img.src = getNomeImmagine(spiritello, variante);
                    img.onerror = function() { img.style.display = 'none'; };

                    box.appendChild(img);
                    cell.appendChild(box);
                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('spiritelli-table').style.display = 'table';
        }

        async function toggle(spiritello, variante, boxElement) {
            if (boxElement.classList.contains('pending')) return;

            const eraAttivo = boxElement.classList.contains('active');
            const eraMastered = boxElement.classList.contains('mastered');

            // ✅ CASO 3: Mastered (dorato) → Click → Elimina completamente
            if (eraMastered) {
                boxElement.classList.remove('active', 'mastered');
                boxElement.classList.add('pending');
                
                try {
                    const res = await fetch('/api/toggle', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            spiritello: spiritello,
                            variante: variante,
                            mastered: false,  // ✅ Elimina
                            initData: tg.initData || initData
                        })
                    });

                    if (!res.ok) {
                        if (res.status === 429) {
                            mostraErrore('Troppe modifiche veloci, rallenta un attimo');
                        } else {
                            mostraErrore('Errore nel salvataggio, riprova');
                        }
                        boxElement.classList.add('mastered');
                        return;
                    }

                    // ✅ ELIMINA dalla collezione locale
                    collezione = collezione.filter(function(s) {
                        return !(s.spiritello === spiritello && s.variante === variante);
                    });

                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                } catch (e) {
                    console.log("Errore rete: " + e.message);
                    mostraErrore('Errore di connessione, riprova');
                    boxElement.classList.add('mastered');
                } finally {
                    boxElement.classList.remove('pending');
                }
                return;
            }

            // ✅ CASO 2: Active (verde) + NON mastered → Click → Mastered (dorato)
            if (eraAttivo && !eraMastered) {
                boxElement.classList.remove('active');
                boxElement.classList.add('mastered', 'pending');
                
                try {
                    const res = await fetch('/api/toggle', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            spiritello: spiritello,
                            variante: variante,
                            mastered: true,  // ✅ Mastera
                            initData: tg.initData || initData
                        })
                    });

                    if (!res.ok) {
                        boxElement.classList.add('active');
                        boxElement.classList.remove('mastered');
                        mostraErrore('Errore nel salvataggio, riprova');
                        return;
                    }

                    // ✅ Aggiorna collezione locale
                    const item = collezione.find(function(s) {
                        return s.spiritello === spiritello && s.variante === variante;
                    });
                    if (item) item.mastered = true;

                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                } catch (e) {
                    console.log("Errore rete: " + e.message);
                    mostraErrore('Errore di connessione, riprova');
                    boxElement.classList.add('active');
                    boxElement.classList.remove('mastered');
                } finally {
                    boxElement.classList.remove('pending');
                }
                return;
            }

            // ✅ CASO 1: Nessuno → Click → Active (verde)
            boxElement.classList.add('active', 'pending');

            try {
                const res = await fetch('/api/toggle', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        spiritello: spiritello,
                        variante: variante,
                        mastered: false,  // ✅ Primo click = verde
                        initData: tg.initData || initData
                    })
                });

                if (!res.ok) {
                    if (res.status === 429) {
                        mostraErrore('Troppe modifiche veloci, rallenta un attimo');
                    } else {
                        mostraErrore('Errore nel salvataggio, riprova');
                    }
                    boxElement.classList.remove('active');
                    return;
                }

                collezione.push({
                    spiritello: spiritello,
                    variante: variante,
                    mastered: false
                });

                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            } catch (e) {
                console.log("Errore rete: " + e.message);
                mostraErrore('Errore di connessione, riprova');
                boxElement.classList.remove('active');
            } finally {
                boxElement.classList.remove('pending');
            }
        }

        async function creaImmagine() {
            const btn = document.getElementById('creaImmagineBtn');
            btn.disabled = true;
            btn.textContent = 'Creazione in corso...';

            try {
                const container = document.getElementById('screenshot-container');
                const tableWrapper = document.querySelector('.table-wrapper');
                
                // Memorizza lo stile originale
                const originalOverflow = tableWrapper.style.overflow;
                const originalMaxHeight = tableWrapper.style.maxHeight;
                
                // Rimuovi lo scroll per mostrare tutto
                tableWrapper.style.overflow = 'visible';
                tableWrapper.style.maxHeight = 'none';
                
                // Aggiungi sfondo temporaneo al container
                const originalBg = container.style.background;
                container.style.background = "url('/static/background.png') center/cover no-repeat";
                
                // Crea elemento watermark
                const watermark = document.createElement('div');
                watermark.style.textAlign = 'center';
                watermark.style.marginTop = '20px';
                watermark.style.fontSize = '12px';
                watermark.style.color = 'rgba(0, 255, 255, 0.8)';
                watermark.style.fontFamily = 'Fredoka, sans-serif';
                watermark.style.textShadow = '0 0 5px rgba(0, 255, 255, 0.5)';
                watermark.textContent = 'By Fortnite_Italia_Leaks on Telegram';
                
                container.appendChild(watermark);
                
                const canvas = await html2canvas(container, {
                    backgroundColor: null,
                    scale: 1,
                    useCORS: true,
                    allowTaint: true
                });
                
                // Ripristina lo stile originale
                tableWrapper.style.overflow = originalOverflow;
                tableWrapper.style.maxHeight = originalMaxHeight;
                container.style.background = originalBg;
                container.removeChild(watermark);
                
                const imageData = canvas.toDataURL('image/png');
                
                const res = await fetch('/api/invia-screenshot', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        screenshot: imageData,
                        initData: tg.initData || initData
                    })
                });

                if (!res.ok) throw new Error('Errore invio');
                
                mostraSuccesso('✓ Screenshot inviato nella chat!');
                
            } catch (e) {
                mostraErrore('Errore: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Crea Immagine';
            }
        }

        function mostraErrore(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.className = 'error';
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            
            // Auto-nascondi dopo 3 secondi
            setTimeout(function() {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        function mostraSuccesso(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.className = 'success';
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            
            // Auto-nascondi dopo 3 secondi
            setTimeout(function() {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        document.getElementById('creaImmagineBtn').addEventListener('click', creaImmagine);

        carica();
    </script>
</body>
</html>
